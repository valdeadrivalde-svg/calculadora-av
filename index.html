<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora AV Pro</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --danger: #ef4444; --text: #f8fafc; }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 110px; }
    h1 { font-size: 1.4rem; text-align: center; color: var(--accent); margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card { background: var(--card); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #334155; }
    .icon { font-size: 1.8rem; }
    .title { font-size: 0.8rem; font-weight: bold; margin: 4px 0; }
    .watts { font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn { background: #334155; color: white; border: none; border-radius: 6px; width: 30px; height: 30px; font-weight: bold; font-size: 1rem; }
    .summary { position: fixed; bottom: 0; left: 0; right: 0; background: #090d16; border-top: 2px solid var(--accent); padding: 14px; }
    .row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
    .val { font-weight: bold; color: var(--accent); }
    .alert { background: #064e3b; color: #6ee7b7; padding: 8px; border-radius: 6px; font-size: 0.75rem; text-align: center; margin-top: 6px; }
    .warn { background: #451a03; color: #fdba74; }
    .danger { background: #450a0a; color: #fca5a5; }
  </style>
</head>
<body>
  <h1>⚡ Calculadora AV Pro</h1>
  <div class="grid" id="grid"></div>
  <div class="summary">
    <div class="row"><span>Consumo Total:</span><span class="val" id="w">0 W</span></div>
    <div class="row"><span>Amperios (230V):</span><span class="val" id="a">0.0 A</span></div>
    <div id="st" class="alert">✅ Selecciona equipos para calcular.</div>
  </div>
  <script>
    const CAT = [
      { id: 'led', name: 'Panel LED 50x50', w: 150, i: '🖥️' },
      { id: 'tv', name: 'TV 60"', w: 180, i: '📺' },
      { id: 'bm', name: 'Control Blackmagic', w: 450, i: '🎛️' },
      { id: 'foco', name: 'Foco LED 600W', w: 650, i: '💡' },
      { id: 'sub', name: 'Subwoofer PA', w: 800, i: '🔊' },
      { id: 'pc', name: 'Portátil / Control', w: 90, i: '💻' }
    ];
    let st = {}; CAT.forEach(x => st[x.id] = 0);
    function draw() {
      document.getElementById('grid').innerHTML = CAT.map(x => `
        <div class="card">
          <div class="icon">${x.i}</div>
          <div class="title">${x.name}</div>
          <div class="watts">${x.w} W</div>
          <div class="controls">
            <button class="btn" onclick="add('${x.id}',-1)">-</button>
            <span>${st[x.id]}</span>
            <button class="btn" onclick="add('${x.id}',1)">+</button>
          </div>
        </div>
      `).join('');
    }
    function add(id, d) { st[id] = Math.max(0, st[id] + d); draw(); calc(); }
    function calc() {
      let tw = 0; CAT.forEach(x => tw += st[x.id] * x.w);
      let ta = (tw / 230).toFixed(1);
      document.getElementById('w').innerText = tw + ' W';
      document.getElementById('a').innerText = ta + ' A';
      let box = document.getElementById('st');
      if (tw === 0) { box.className = 'alert'; box.innerText = '✅ Selecciona equipos para calcular.'; }
      else if (tw <= 3500) { box.className = 'alert'; box.innerText = '✅ Aguanta en una sola regleta (16A / Schuko).'; }
      else if (tw <= 7000) { box.className = 'alert warn'; box.innerText = '⚠ Repartir en 2 regletas independientes (o Cetac 32A).'; }
      else { box.className = 'alert danger'; box.innerText = '🚨 Requiere Cuadro Trifásico con reparto de fases.'; }
    }
    draw();
  </script>
</body>
</html>
